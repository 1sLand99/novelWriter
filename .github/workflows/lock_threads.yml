name: Lock Threads

on:
  schedule:
    - cron: "14 3 * * *"

concurrency:
  group: lock-threads

jobs:
  action:
    name: Lock Old Issues & PRs
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # 6.0.2
        with:
          github-token: ${{ secrets.SAGA_SOFT_BOT_TOKEN }}
          issue-inactive-days: 120
          issue-comment: >
            This issue has been automatically locked since there has not been
            any recent activity after it was closed. Please open a new issue
            for related bugs or feature requests.
          issue-lock-reason: "resolved"
          pr-inactive-days: 120
          pr-lock-reason: "resolved"
          process-only: "issue, pr"
          log-output: true
