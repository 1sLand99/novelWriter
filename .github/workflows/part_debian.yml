name: Part-Debian

on:
  workflow_call:
    inputs:
      publish:
        required: false
        type: boolean
        default: false
    secrets:
      CLOUDSMITH_API_KEY:
        required: false

jobs:
  buildPackage:
    name: Build Debian Package (${{ matrix.codename }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - codename: bookworm
            family: debian
            image: debian:12
          - codename: trixie
            family: debian
            image: debian:13
          - codename: noble
            family: ubuntu
            image: ubuntu:24.04
          - codename: resolute
            family: ubuntu
            image: ubuntu:26.04
          - codename: stonking
            family: ubuntu
            image: ubuntu:26.10
    steps:
      - name: Install Checkout Prerequisites
        run: |
          apt-get update
          apt-get install -y git ca-certificates python3

      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Download Assets Artifact
        uses: actions/download-artifact@v8
        with:
          name: nw-assets
          path: novelwriter/assets

      - name: Install Native Packages
        run: apt-get install -y $(python3 pkgutils.py build-deb-depends ${{ matrix.codename }})

      - name: Build Package
        run: python3 pkgutils.py build-deb ${{ matrix.codename }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nw-deb-${{ matrix.codename }}
          path: dist_upload/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish to Cloudsmith
        if: ${{ inputs.publish }}
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          apt-get install -y python3-pip
          pip install --break-system-packages --ignore-installed cloudsmith-cli
          CHANNEL="$(python3 pkgutils.py channel)"
          REPO="saga-soft/stable"
          if [ "$CHANNEL" = "pre" ]; then
            REPO="saga-soft/testing"
          fi
          DEB_FILE="$(find dist_upload -name '*.deb')"
          cloudsmith push deb "$REPO/${{ matrix.family }}/${{ matrix.codename }}" "$DEB_FILE" --api-key "$CLOUDSMITH_API_KEY" --republish
