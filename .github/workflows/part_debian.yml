name: Part-Debian

on:
  workflow_call:
    inputs:
      publish:
        required: false
        type: boolean
        default: false
      codename:
        required: true
        type: string
      family:
        required: true
        type: string
      image:
        required: true
        type: string
    secrets:
      CLOUDSMITH_API_KEY:
        required: false

jobs:
  buildPackage:
    name: Build Debian Package (${{ inputs.codename }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ${{ inputs.image }}
    steps:
      - name: Install Checkout Prerequisites
        run: |
          apt-get update
          apt-get install -y git ca-certificates python3

      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Download Assets Artifact
        uses: actions/download-artifact@v8
        with:
          name: nw-assets
          path: novelwriter/assets

      - name: Install Native Packages
        run: apt-get install -y $(python3 pkgutils.py build-deb-depends ${{ inputs.codename }})

      - name: Build Package
        run: python3 pkgutils.py build-deb ${{ inputs.codename }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nw-deb-${{ inputs.codename }}
          path: dist_upload/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish to Cloudsmith
        if: ${{ inputs.publish }}
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          apt-get install -y python3-pip
          pip install --break-system-packages --ignore-installed cloudsmith-cli
          CHANNEL="$(python3 pkgutils.py channel)"
          REPO="saga-soft/stable"
          if [ "$CHANNEL" = "pre" ]; then
            REPO="saga-soft/testing"
          fi
          DEB_FILE="$(find dist_upload -name '*.deb')"
          cloudsmith push deb "$REPO/${{ inputs.family }}/${{ inputs.codename }}" "$DEB_FILE" --api-key "$CLOUDSMITH_API_KEY" --republish
