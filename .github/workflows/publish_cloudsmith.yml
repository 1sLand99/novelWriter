name: Publish-Cloudsmith

on:
  workflow_dispatch:
    inputs:
      publish:
        required: false
        description: "Publish to Cloudsmith?"
        type: boolean
        default: false

jobs:
  buildAssets:
    uses: ./.github/workflows/part_assets.yml
    with:
      icons-free: true
      icons-non-free: true
    permissions:
      contents: read

  buildAndPublish:
    needs: buildAssets
    uses: ./.github/workflows/part_debian.yml
    with:
      publish: ${{ inputs.publish }}
    secrets: inherit
    permissions:
      contents: read
