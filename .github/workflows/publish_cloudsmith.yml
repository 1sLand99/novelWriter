name: PublishCloudsmith

on: workflow_dispatch

jobs:
  buildAssets:
    uses: ./.github/workflows/part_assets.yml
    with:
      icons-free: true
      icons-non-free: true
    permissions:
      contents: read

  buildAndPublish:
    needs: buildAssets
    uses: ./.github/workflows/part_debian.yml
    with:
      publish: true
    secrets: inherit
    permissions:
      contents: read
