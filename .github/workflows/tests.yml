name: Tests

on:
  push:
    branches:
      - main
      - release
  pull_request:
    branches:
      - main
      - release

jobs:
  testLinux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
      fail-fast: false
    name: Linux Python ${{ matrix.python-version }}
    permissions:
      contents: read
    env:
      COVERAGE_FILE: .coverage.py${{ matrix.python-version }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Install System Packages
        run: |
          sudo apt update
          sudo apt install qttools5-dev-tools

      - name: Install UV and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --no-dev --group test

      - name: Build Assets
        run: |
          uv run --no-sync pkgutils.py qtlrelease
          uv run --no-sync pkgutils.py sample

      - name: Run Tests
        run: |
          export QT_QPA_PLATFORM=offscreen
          uv run --no-sync coverage run -m pytest -v --timeout=60
          uv run --no-sync coverage report --skip-covered --show-missing

      - name: Upload Coverage Data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-py${{ matrix.python-version }}
          path: ${{ env.COVERAGE_FILE }}
          include-hidden-files: true
          retention-days: 1

  testMac:
    runs-on: macos-latest
    name: MacOS Python 3.14
    permissions:
      contents: read
    env:
      COVERAGE_FILE: .coverage.mac
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Install System Packages
        run: |
          brew install enchant

      - name: Install UV and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --no-dev --group test

      - name: Build Assets
        run: |
          uv run --no-sync pkgutils.py sample

      - name: Run Tests
        run: |
          export QT_QPA_PLATFORM=offscreen
          uv run --no-sync coverage run -m pytest -v --timeout=60
          uv run --no-sync coverage report --skip-covered --show-missing

      - name: Upload Coverage Data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-mac
          path: ${{ env.COVERAGE_FILE }}
          include-hidden-files: true
          retention-days: 1

  testWin:
    runs-on: windows-latest
    name: Windows Python 3.14
    permissions:
      contents: read
    env:
      COVERAGE_FILE: .coverage.win
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Install UV and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --no-dev --group test

      - name: Build Assets
        run: |
          uv run --no-sync pkgutils.py sample

      - name: Run Tests
        run: |
          uv run --no-sync coverage run -m pytest -v --timeout=60
          uv run --no-sync coverage report --skip-covered --show-missing

      - name: Upload Coverage Data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-win
          path: ${{ env.COVERAGE_FILE }}
          include-hidden-files: true
          retention-days: 1

  testUbuntu24:
    name: Ubuntu 24.04 & Sys Packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Install System Packages
        run: |
          sudo apt update
          sudo apt install \
            python3-pyqt6 \
            python3-pyqt6.qtsvg \
            python3-pytest \
            python3-pytestqt \
            python3-enchant \
            python3-pytest-timeout \
            qt6-image-formats-plugins

      - name: Build Assets
        run: |
          python3 pkgutils.py sample

      - name: Run Tests
        run: |
          export QT_QPA_PLATFORM=offscreen
          python3 -m pytest -v --timeout=60

  testFedoraLatest:
    name: Fedora 44 & Sys Packages
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    permissions:
      contents: read
    steps:
      - name: Install System Packages
        run: |
          dnf -y update
          dnf -y install \
            git \
            python3-enchant \
            python3-pyqt6 \
            python3-pytest \
            python3-pytest-qt \
            python3-pytest-timeout \
            qt6-linguist \
            qt6-qtimageformats

      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Run Build Commands
        run: |
          python pkgutils.py qtlrelease
          python pkgutils.py sample

      - name: Run Tests
        run: |
          export QT_QPA_PLATFORM=offscreen
          python3 -m pytest -v --timeout=60
